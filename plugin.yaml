name: zonos3-tts
version: 1.10.3
description: "ZONOS3-Mini text-to-speech on the native Zyphra ggml/CUDA runtime — lease-driven warm-up, idle VRAM unload by process stop, 27 built-in voices, SenseVoice speech recognition (optional STT provider) with emotion steering, and optional Windows audio ducking."
license: "MIT"
platforms: ["windows", "linux", "macos"]
# Deliberately empty. pycaw/comtypes are only needed for Windows audio ducking,
# which is an optional feature that fails open; declaring them here makes every
# config write trigger a pip install, and makes a Linux/macOS install depend on
# Windows-only packages. If ducking is wanted, install them explicitly:
#   pip install pycaw comtypes
pip_dependencies: []
requires_env: []
hooks: []
